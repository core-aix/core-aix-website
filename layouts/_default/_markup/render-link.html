{{- $href := .Destination -}}
{{- $opensNewTab := or (hasPrefix $href "http://") (hasPrefix $href "https://") (hasPrefix $href "/papers/") -}}
<a href="{{ $href | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $opensNewTab }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Text | safeHTML }}</a>
