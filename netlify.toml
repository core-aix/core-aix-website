[build]
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.142.0"
  HUGO_ENV = "production"

[dev]
  framework = "hugo"
  command = "hugo server --port 1313 --bind 127.0.0.1"
  targetPort = 1313

# Paper landing pages moved next to their PDFs, which Google Scholar requires.
# Pretty URLs serves /papers/name.html at /papers/name, so redirect straight
# there. The mixed-case .html rules cover links shared before the rename.
[[redirects]]
  from = "/publications/federation-is-the-way-forward-for-ai-agents/"
  to = "/papers/hw_fedagents2026"
  status = 301

[[redirects]]
  from = "/publications/sw-icmlposition-2026/"
  to = "/papers/sw_icmlposition2026"
  status = 301

[[redirects]]
  from = "/papers/HW_FedAgents2026.html"
  to = "/papers/hw_fedagents2026"
  status = 301

[[redirects]]
  from = "/papers/SW_ICMLPosition2026.html"
  to = "/papers/sw_icmlposition2026"
  status = 301

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The lecture dashboard is a standalone page under static/, so Hugo copies it
# straight through. It is kept out of search results on purpose.
[[headers]]
  for = "/bandit/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# The machine game dashboard follows the same pattern.
[[headers]]
  for = "/machine/*"
  [headers.values]
    X-Robots-Tag = "noindex"
